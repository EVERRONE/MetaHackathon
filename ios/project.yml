name: Pip
options:
  bundleIdPrefix: be.unveil
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  PipCore:
    path: PipCore
configFiles:
  Debug: Config/Pip.xcconfig
  Release: Config/Pip.xcconfig
targets:
  Pip:
    type: application
    platform: iOS
    sources:
      - path: PipApp
      # Meta's EdgeTAM tracker (scripts/fetch-edgetam.sh); Xcode compiles the packages into the app.
      - path: Models/EdgeTAM
        optional: true
      # Meta's DINOv2 ViT-S/14 (scripts/convert-dinov2.py): links sessions across a change of light.
      - path: Models/DINOv2
        optional: true
    dependencies:
      - package: PipCore
        product: PipCore
    info:
      path: PipApp/Info.plist
      properties:
        CFBundleDisplayName: Pip
        CFBundleShortVersionString: "0.1.0"
        # Raised with a new launch screen: iOS keeps the one it drew for a build number.
        CFBundleVersion: "2"
        # Pip's mark and name on the night-blue field (scripts/make-brand.swift).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
        NSCameraUsageDescription: Pip looks at your task through the camera to point at the right part.
        NSMicrophoneUsageDescription: Pip listens to your questions while your hands are busy.
        NSLocationWhenInUseUsageDescription: Pip uses your rough location only to know which of your saved rooms you may be in. It stays on this iPhone.
        PIPBaseURL: $(PIP_BASE_URL)
        PIPAppToken: $(PIP_APP_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.unveil.pip.dev
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The models are loaded by name (PipCore's EdgeTAM), not through generated classes.
        COREML_CODEGEN_LANGUAGE: None
