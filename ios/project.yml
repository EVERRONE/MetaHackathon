name: Pip
options:
  bundleIdPrefix: be.unveil
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  PipCore:
    path: PipCore
configFiles:
  Debug: Config/Pip.xcconfig
  Release: Config/Pip.xcconfig
targets:
  Pip:
    type: application
    platform: iOS
    sources:
      - path: PipApp
    dependencies:
      - package: PipCore
        product: PipCore
    info:
      path: PipApp/Info.plist
      properties:
        CFBundleDisplayName: Pip
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
        NSCameraUsageDescription: Pip looks at your task through the camera to point at the right part.
        NSMicrophoneUsageDescription: Pip listens to your questions while your hands are busy.
        PIPBaseURL: $(PIP_BASE_URL)
        PIPAppToken: $(PIP_APP_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.unveil.pip.dev
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
